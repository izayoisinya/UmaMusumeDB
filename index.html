<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因子台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ledger">
  <div class="masthead">
    <h1>因子台帳</h1>
    <p id="countLabel">0 頭 登録</p>
  </div>

  <div class="layout">
    <div class="left-col">
      <div class="panel">
        <h2>GitHub連携設定</h2>
        <p class="hint">この台帳のデータは、このリポジトリの <code>data/factors.json</code> に保存されます。読み書きには Contents 権限を持つ個人アクセストークン(PAT)が必要です。</p>
        <div class="form-grid">
          <div>
            <label for="cfgOwner">リポジトリ所有者</label>
            <input type="text" id="cfgOwner" placeholder="例: izayoisinya">
          </div>
          <div>
            <label for="cfgRepo">リポジトリ名</label>
            <input type="text" id="cfgRepo" placeholder="例: UmaMusumeDB">
          </div>
          <div>
            <label for="cfgBranch">ブランチ</label>
            <input type="text" id="cfgBranch" placeholder="main">
          </div>
          <div>
            <label for="cfgToken">個人アクセストークン (PAT)</label>
            <input type="password" id="cfgToken" placeholder="このリポジトリのContents読み書き権限を持つトークン" autocomplete="off">
          </div>
          <button type="button" class="btn" id="cfgSaveBtn">保存して読み込む</button>
          <button type="button" class="btn secondary" id="cfgClearBtn">設定を消去</button>
        </div>
        <div class="status" id="cfgStatus"></div>
      </div>

      <div class="panel">
        <h2>因子を登録</h2>

        <p class="hint">
          継承画面のスクリーンショットをClaudeアプリに見せて、下のプロンプトで因子情報をJSON抽出してもらい、その出力をここに貼り付けてください。
        </p>
        <button type="button" class="btn secondary" id="copyPromptBtn">Claude用プロンプトをコピー</button>
        <div class="form-grid">
          <div>
            <label for="pasteJson">Claudeの出力を貼り付け</label>
            <textarea id="pasteJson" rows="4" placeholder='{"character": "...", "blue_factors": [{"name":"...", "self":N, "parent1":N, "parent2":N}], "red_factors": [...], "green_factors": [...], "white_factors": [...]}'></textarea>
          </div>
          <button type="button" class="btn" id="loadJsonBtn">この内容をフォームに反映</button>
        </div>
        <div class="status" id="status"></div>

        <form class="form-grid" id="entryForm">
          <div>
            <label for="fCharacter">キャラ名</label>
            <input type="text" id="fCharacter" placeholder="例: スペシャルウィーク">
          </div>

          <div class="factor-row">
            <div style="flex:1;">
              <label for="fParent1">継承元1</label>
              <input type="text" id="fParent1" placeholder="親1のキャラ名（手入力）">
            </div>
            <div style="flex:1;">
              <label for="fParent2">継承元2</label>
              <input type="text" id="fParent2" placeholder="親2のキャラ名（手入力）">
            </div>
          </div>

          <div>
            <label>青因子（本体・親1・親2）</label>
            <div class="stack-header">
              <span>因子名</span><span>本体</span><span>親1</span><span>親2</span><span></span>
            </div>
            <div class="factor-list-edit" id="blueList"></div>
            <button type="button" class="add-line" data-add="blue">＋ 青因子を追加</button>
          </div>

          <div>
            <label>赤因子（本体・親1・親2）</label>
            <div class="stack-header">
              <span>因子名</span><span>本体</span><span>親1</span><span>親2</span><span></span>
            </div>
            <div class="factor-list-edit" id="redList"></div>
            <button type="button" class="add-line" data-add="red">＋ 赤因子を追加</button>
          </div>

          <div>
            <label>緑因子（固有・本体・親1・親2）</label>
            <div class="stack-header">
              <span>因子名</span><span>本体</span><span>親1</span><span>親2</span><span></span>
            </div>
            <div class="factor-list-edit" id="greenList"></div>
            <button type="button" class="add-line" data-add="green">＋ 緑因子を追加</button>
          </div>

          <div>
            <label>白因子（本体・親1・親2）</label>
            <div class="stack-header">
              <span>因子名</span><span>本体</span><span>親1</span><span>親2</span><span></span>
            </div>
            <div class="factor-list-edit" id="whiteList"></div>
            <button type="button" class="add-line" data-add="white">＋ 白因子を追加</button>
          </div>

          <div>
            <label for="fNotes">メモ</label>
            <textarea id="fNotes" rows="2" placeholder="用途など"></textarea>
          </div>

          <button type="submit" class="btn">この内容を保存</button>
          <button type="button" class="btn secondary" id="clearBtn">フォームをクリア</button>
        </form>
      </div>
    </div>

    <div class="panel">
      <h2>
        登録済み一覧
        <button type="button" class="btn secondary btn-inline" id="refreshBtn">更新</button>
      </h2>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="キャラ名・因子名で検索">
      </div>
      <div class="status" id="listStatus"></div>
      <div class="entries" id="entries"></div>
      <div class="empty" id="emptyMsg" style="display:none;">まだ登録がありません。左でClaudeの出力を貼り付けるか、手入力して保存してください。</div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
