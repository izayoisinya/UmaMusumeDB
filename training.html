<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>育成計画 - 因子台帳</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8bc34a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="因子台帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ledger pvp-page">
  <div class="masthead">
    <div class="masthead-top">
      <h1>育成計画</h1>
      <p id="countLabel">0 件記録</p>
    </div>
    <div class="masthead-menu">
      <button type="button" class="masthead-btn" id="openRegisterModalBtn">＋ 計画を追加</button>
      <a href="index.html" class="masthead-btn masthead-nav">因子台帳</a>
      <a href="uma.html" class="masthead-btn masthead-nav">ウマ娘</a>
      <a href="support.html" class="masthead-btn masthead-nav">サポカ</a>
      <a href="skill.html" class="masthead-btn masthead-nav">スキル</a>
      <a href="pvp.html" class="masthead-btn masthead-nav">対人イベント</a>
      <a href="training.html" class="masthead-btn masthead-nav">育成計画</a>
      <button type="button" class="masthead-btn" id="openSettingsModalBtn">⚙ 設定</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel list-panel">
      <h2>
        進捗ごとの計画
        <button type="button" class="btn secondary btn-inline" id="refreshBtn">更新</button>
      </h2>

      <div class="status" id="listStatus"></div>
      <div id="entries"></div>
      <div class="empty" id="emptyMsg" style="display:none;">まだ計画がありません。「＋ 計画を追加」から入力して保存してください。</div>
    </div>
  </div>
</div>

<div class="scroll-fab-group" id="scrollFabGroup">
  <button type="button" class="scroll-fab" id="scrollTopBtn" aria-label="一番上へ">↑</button>
  <button type="button" class="scroll-fab" id="scrollBottomBtn" aria-label="一番下へ">↓</button>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" id="trainingModal" role="dialog" aria-labelledby="trainingModalTitle" hidden>
    <h2 id="trainingModalTitle">育成計画を追加</h2>

    <form class="form-grid" id="trainingForm">
      <div>
        <label for="fMonth">開催月</label>
        <input type="month" id="fMonth">
      </div>

      <div>
        <label for="fTitle">タイトル</label>
        <input type="text" id="fTitle" placeholder="例: 毎日王冠チャンミ、ロンシャンチャンミ">
      </div>

      <div>
        <label>進捗</label>
        <div class="radio-pill-row">
          <label class="radio-pill"><input type="radio" name="fStatus" value="not_started" checked>未着手</label>
          <label class="radio-pill"><input type="radio" name="fStatus" value="in_progress">育成中</label>
          <label class="radio-pill"><input type="radio" name="fStatus" value="done">完了</label>
        </div>
      </div>

      <div>
        <label>目標イベント種別</label>
        <div class="radio-pill-row">
          <label class="radio-pill"><input type="radio" name="fEventType" value="champions" checked>チャンピオンズミーティング</label>
          <label class="radio-pill"><input type="radio" name="fEventType" value="loh">リーグオブヒーローズ</label>
        </div>
      </div>

      <div class="event-section">
        <label>レース条件</label>
        <div>
          <label for="fLocation">場所</label>
          <select id="fLocation">
            <option value="">未選択</option>
            <option value="東京">東京</option>
            <option value="中山">中山</option>
            <option value="阪神">阪神</option>
            <option value="京都">京都</option>
            <option value="中京">中京</option>
            <option value="小倉">小倉</option>
            <option value="新潟">新潟</option>
            <option value="福島">福島</option>
            <option value="札幌">札幌</option>
            <option value="函館">函館</option>
            <option value="ロンシャン">ロンシャン</option>
          </select>
        </div>
        <div>
          <label for="fDistance">距離(m)</label>
          <input type="number" id="fDistance" min="0" step="100" placeholder="例: 1800">
        </div>
        <div>
          <label>バ場</label>
          <div class="radio-pill-row">
            <label class="radio-pill"><input type="radio" name="fSurface" value="芝" checked>芝</label>
            <label class="radio-pill"><input type="radio" name="fSurface" value="ダート">ダート</label>
          </div>
        </div>
        <div>
          <label>コース</label>
          <div class="radio-pill-row">
            <label class="radio-pill"><input type="radio" name="fTrackDirection" value="右回り" checked>右回り</label>
            <label class="radio-pill"><input type="radio" name="fTrackDirection" value="左回り">左回り</label>
          </div>
        </div>
        <div>
          <label>季節</label>
          <div class="radio-pill-row">
            <label class="radio-pill"><input type="radio" name="fSeason" value="春" checked>春</label>
            <label class="radio-pill"><input type="radio" name="fSeason" value="夏">夏</label>
            <label class="radio-pill"><input type="radio" name="fSeason" value="秋">秋</label>
            <label class="radio-pill"><input type="radio" name="fSeason" value="冬">冬</label>
          </div>
        </div>
        <div>
          <label>天候</label>
          <div class="radio-pill-row">
            <label class="radio-pill"><input type="radio" name="fWeather" value="晴" checked>晴</label>
            <label class="radio-pill"><input type="radio" name="fWeather" value="曇">曇</label>
            <label class="radio-pill"><input type="radio" name="fWeather" value="雨">雨</label>
            <label class="radio-pill"><input type="radio" name="fWeather" value="雪">雪</label>
          </div>
        </div>
        <div>
          <label>バ場状態</label>
          <div class="radio-pill-row">
            <label class="radio-pill"><input type="radio" name="fGoing" value="良" checked>良</label>
            <label class="radio-pill"><input type="radio" name="fGoing" value="稍重">稍重</label>
            <label class="radio-pill"><input type="radio" name="fGoing" value="重">重</label>
            <label class="radio-pill"><input type="radio" name="fGoing" value="不良">不良</label>
          </div>
        </div>
      </div>

      <div>
        <label>育成予定ウマ娘（3人）</label>
        <div class="team-slots-grid">
          <div class="team-slot">
            <div class="char-select-box" id="charSelectBox1">
              <div id="charSelectEmpty1">タップして選択</div>
              <div class="char-select-filled-inner" id="charSelectFilled1" hidden>
                <img class="uma-icon" id="charSelectIcon1" alt="">
                <span id="charSelectName1"></span>
              </div>
            </div>
            <button type="button" class="btn secondary btn-inline" id="charSelectClearBtn1" hidden>選択を解除</button>
          </div>
          <div class="team-slot">
            <div class="char-select-box" id="charSelectBox2">
              <div id="charSelectEmpty2">タップして選択</div>
              <div class="char-select-filled-inner" id="charSelectFilled2" hidden>
                <img class="uma-icon" id="charSelectIcon2" alt="">
                <span id="charSelectName2"></span>
              </div>
            </div>
            <button type="button" class="btn secondary btn-inline" id="charSelectClearBtn2" hidden>選択を解除</button>
          </div>
          <div class="team-slot">
            <div class="char-select-box" id="charSelectBox3">
              <div id="charSelectEmpty3">タップして選択</div>
              <div class="char-select-filled-inner" id="charSelectFilled3" hidden>
                <img class="uma-icon" id="charSelectIcon3" alt="">
                <span id="charSelectName3"></span>
              </div>
            </div>
            <button type="button" class="btn secondary btn-inline" id="charSelectClearBtn3" hidden>選択を解除</button>
          </div>
        </div>
      </div>

      <div>
        <label for="fNotes">メモ</label>
        <textarea id="fNotes" rows="3" placeholder="継承したい因子、狙いたいサポカ編成など"></textarea>
      </div>

      <div class="status" id="status"></div>
      <button type="submit" class="btn" id="saveTrainingBtn">この内容を保存</button>
      <button type="button" class="btn secondary" id="clearBtn">フォームをクリア</button>
    </form>
    <button type="button" class="btn secondary modal-close-btn" data-modal="trainingModal">閉じる</button>
  </div>

  <div class="modal" id="characterPickerModal" role="dialog" aria-labelledby="characterPickerTitle" hidden>
    <h2 id="characterPickerTitle">育成予定ウマ娘を選択</h2>
    <input type="text" id="characterPickerSearch" class="character-picker-search" placeholder="名前で検索">
    <div id="characterPickerGrid" class="character-picker-grid"></div>
    <div class="status" id="characterPickerStatus"></div>
    <button type="button" class="btn secondary" id="characterPickerCloseBtn">閉じる</button>
  </div>

  <div class="modal" id="confirmDeleteModal" role="dialog" aria-labelledby="confirmDeleteTitle" hidden>
    <h2 id="confirmDeleteTitle">削除の確認</h2>
    <p class="hint" id="confirmDeleteMessage"></p>
    <button type="button" class="btn danger" id="confirmDeleteBtn">削除する</button>
    <button type="button" class="btn secondary modal-close-btn" data-modal="confirmDeleteModal">キャンセル</button>
  </div>

  <div class="modal" id="settingsModal" role="dialog" aria-labelledby="settingsModalTitle" hidden>
    <h2 id="settingsModalTitle">設定</h2>
    <div class="settings-tabs">
      <button type="button" class="settings-tab active" data-tab="display">表示</button>
      <button type="button" class="settings-tab" data-tab="github">GitHub連携</button>
    </div>

    <div class="settings-pane" data-pane="display">
      <p class="hint">アプリの見た目を切り替えます。</p>
      <button type="button" class="btn secondary" id="themeToggleBtn">🌙 ダークモードに切り替え</button>
    </div>

    <div class="settings-pane" data-pane="github" hidden>
      <p class="hint">このアプリのデータは、このリポジトリに保存されます。<strong>閲覧のみならPATなしでも見られます</strong>（リポジトリ所有者・リポジトリ名だけ入力）。保存・削除には Contents 権限を持つ個人アクセストークン(PAT)が必要です。</p>
      <div class="form-grid">
        <div>
          <label for="cfgOwner">リポジトリ所有者</label>
          <input type="text" id="cfgOwner" placeholder="例: izayoisinya">
        </div>
        <div>
          <label for="cfgRepo">リポジトリ名</label>
          <input type="text" id="cfgRepo" placeholder="例: UmaMusumeDB">
        </div>
        <div>
          <label for="cfgBranch">ブランチ</label>
          <input type="text" id="cfgBranch" placeholder="main">
        </div>
        <div>
          <label for="cfgToken">個人アクセストークン (PAT・保存/削除する場合のみ)</label>
          <input type="password" id="cfgToken" placeholder="閲覧だけなら空欄でOK" autocomplete="off">
        </div>
        <button type="button" class="btn" id="cfgSaveBtn">保存して読み込む</button>
        <button type="button" class="btn secondary" id="cfgClearBtn">設定を消去</button>
      </div>
      <div class="status" id="cfgStatus"></div>
    </div>

    <button type="button" class="btn secondary modal-close-btn" data-modal="settingsModal">閉じる</button>
  </div>
</div>

<script src="common.js"></script>
<script src="training.js"></script>
</body>
</html>
